name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sentinelmcp_test
          POSTGRES_PASSWORD: sentinelmcp_ci_only
          POSTGRES_USER: sentinelmcp_test
        options: >-
          --health-cmd "pg_isready -U sentinelmcp_test -d sentinelmcp_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
        ports:
          - 5432:5432
    env:
      SENTINELMCP_DATABASE_URL: postgresql+psycopg://sentinelmcp_test:sentinelmcp_ci_only@localhost:5432/sentinelmcp_test
      SENTINELMCP_TEST_DATABASE_URL: postgresql+psycopg://sentinelmcp_test:sentinelmcp_ci_only@localhost:5432/sentinelmcp_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Lint
        run: python -m ruff check .

      - name: Type check
        run: python -m mypy

      - name: Apply PostgreSQL migrations
        run: python -m alembic upgrade head

      - name: Test
        run: python -m pytest --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: coverage.xml
          if-no-files-found: error
