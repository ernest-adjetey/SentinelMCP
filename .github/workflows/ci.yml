name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sentinelmcp_test
          POSTGRES_PASSWORD: sentinelmcp_ci_only
          POSTGRES_USER: sentinelmcp_test
        options: >-
          --health-cmd "pg_isready -U sentinelmcp_test -d sentinelmcp_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
        ports:
          - 5432:5432
    env:
      SENTINELMCP_DATABASE_URL: postgresql+psycopg://sentinelmcp_test:sentinelmcp_ci_only@localhost:5432/sentinelmcp_test
      SENTINELMCP_TEST_DATABASE_URL: postgresql+psycopg://sentinelmcp_test:sentinelmcp_ci_only@localhost:5432/sentinelmcp_test

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Verify dependency consistency and known vulnerabilities
        run: |
          python -m pip check
          python -m pip list --format=freeze --exclude sentinelmcp > /tmp/third-party-requirements.txt
          python -m pip_audit --strict -r /tmp/third-party-requirements.txt

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Lint
        run: python -m ruff check .

      - name: Type check
        run: python -m mypy

      - name: Apply PostgreSQL migrations
        run: python -m alembic upgrade head

      - name: Test
        run: python -m pytest --cov-report=term-missing --cov-report=xml

      - name: Build and validate distributions
        run: python -m build && python -m twine check dist/*

      - name: Verify wheel in a clean environment
        run: |
          python -m venv /tmp/sentinelmcp-wheel
          /tmp/sentinelmcp-wheel/bin/python -m pip install dist/*.whl
          /tmp/sentinelmcp-wheel/bin/python -m pip check
          PYTHONPATH= /tmp/sentinelmcp-wheel/bin/python scripts/installed_wheel_smoke.py

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ github.sha }}
          path: coverage.xml
          if-no-files-found: error

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
