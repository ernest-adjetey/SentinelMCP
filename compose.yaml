name: sentinelmcp

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sentinelmcp_test}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinelmcp_dev_only}
      POSTGRES_USER: ${POSTGRES_USER:-sentinelmcp_test}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s
    ports:
      - "${POSTGRES_PORT:-54329}:5432"
    restart: unless-stopped
    volumes:
      - sentinelmcp-postgres:/var/lib/postgresql/data

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    restart: unless-stopped
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - sentinelmcp-prometheus:/prometheus

  grafana:
    image: grafana/grafana:12.1.0
    depends_on:
      - prometheus
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    restart: unless-stopped
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - sentinelmcp-grafana:/var/lib/grafana

volumes:
  sentinelmcp-grafana:
  sentinelmcp-postgres:
  sentinelmcp-prometheus:
