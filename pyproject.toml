[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "sentinelmcp"
version = "0.1.0"
description = "Reliability, safety, security, and observability control plane for AI-agent tool execution"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Ernest Adjei Adjetey" }]
keywords = [
  "ai-agents",
  "mcp",
  "observability",
  "reliability",
  "safety",
  "security",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  "mcp>=2.3,<3",
  "opentelemetry-api>=1.44,<2",
  "prometheus-client>=0.24,<1",
  "psycopg[binary]>=3.2,<4",
  "PyJWT[crypto]>=2.15.1,<3",
  "pydantic>=2.9,<3",
  "rfc8785>=0.1.4,<1",
  "semver>=3.0,<4",
  "sqlalchemy>=2.0,<3",
]

[project.scripts]
sentinel = "sentinelmcp.cli:main"

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "hypothesis>=6.115,<7",
  "mypy>=1.13,<2",
  "opentelemetry-sdk>=1.44,<2",
  "pip-audit>=2.9,<3",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6,<7",
  "ruff>=0.8,<1",
  "twine>=6,<7",
  "types-jsonschema>=4.23,<5",
]

[project.urls]
Homepage = "https://ernest-adjetey.github.io/"
Documentation = "https://github.com/ernest-adjetey/SentinelMCP/tree/main/docs"
Issues = "https://github.com/ernest-adjetey/SentinelMCP/issues"
Repository = "https://github.com/ernest-adjetey/SentinelMCP"

[tool.hatch.build]
exclude = [
  "/.devtools",
  "/.devtools/**",
  "/.hypothesis",
  "/.hypothesis/**",
  "/.mypy_cache/**",
  "/.pytest_cache/**",
  "/.ruff_cache/**",
  "/artifacts/**",
  "/benchmark-results/**",
  "/benchmarks/results/**",
  "/dist/**",
]

[tool.hatch.build.targets.wheel]
core-metadata-version = "2.4"
packages = ["src/sentinelmcp"]

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"

[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
  "-Werror",
  "--cov=sentinelmcp",
  "--cov-report=term-missing:skip-covered",
  "--cov-fail-under=95",
]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "postgres: requires a real PostgreSQL instance configured for tests",
]

[tool.coverage.run]
branch = true
source = ["sentinelmcp"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
show_missing = true

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]
mypy_path = "src"
warn_unreachable = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["sentinelmcp"]
